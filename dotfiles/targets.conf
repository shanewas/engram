# kind|source|dest[|exclude=glob,glob]
# kind: file = rendered template ({{HOME}} {{HOME_JSON}} {{HOME_FWD}} {{VAR:x}} {{SECRET:x}})
#       dir  = verbatim copy; deletes only files it previously applied
# dest may use {{HOME}} and {{APPDATA}}. Missing sources are skipped, so start with `dotfiles.py save`.
